<style>

:root {
    --guinda: #682444;

* {

body {

/* CONTENEDOR PRINCIPAL */

/* ENCABEZADO */

header {
    background: var(--guinda);

    border-radius: 20px;

header h1 {
    margin: 0;

/* SELECTOR */

.control-camara {

    background: white;

    border-radius: 16px;

    padding: 15px;

    box-shadow: var(--sombra);

    margin-bottom: 18px;
}

.control-camara label {

    display: block;

    font-size: 13px;

}

select {

    width: 100%;

    padding: 12px;

    border-radius: 10px;

    border: 1px solid #d1d5db;

    background: white;

/* CAMARA */

.scanner-card {

    background: white;

    margin-bottom: 18px;

.scanner-title {

#marco-qr {

    position: absolute;

    width: 55%;

    aspect-ratio: 1;

    max-width: 260px;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);

    border: 3px solid #00e5ff;

    border-radius: 18px;

    box-shadow:
        0 0 0 9999px rgba(0,0,0,.25),

#cartel-estado {

    margin: 18px auto 0;

    border-radius: 18px;

        background .3s,

}

#cartel-estado h2 {

    margin: 0 0 8px;

}

#cartel-estado p {

}

#detalle {

    opacity: .9;

    font-size: 13px !important;

/* BOTONES */

.botones {

    display: flex;

    gap: 10px;

    margin-top: 15px;
}

button {

    flex: 1;

    border: none;

    padding: 13px;

    border-radius: 11px;

    cursor: pointer;

    font-size: 14px;

    font-weight: bold;

    transition: .2s;
}

button:hover {

    transform: translateY(-2px);
}

.btn-iniciar {

    background: var(--guinda);

    color: white;
}

.btn-detener {

    background: #374151;

    color: white;
}


/* OFFLINE */

.sufijo-offline {

    margin-top: 10px;

    font-size: 12px;
}


/* HISTORIAL */

.historial {

    background: white;

    border-radius: 20px;

    padding: 20px;

    box-shadow: var(--sombra);

    margin-top: 18px;
}

.historial h2 {

.historial-item {

    display: flex;

}

.historial-item.permitido {

}

.historial-item.denegado {

    border-left-color: var(--rojo);
}

.historial-nombre {

    font-weight: bold;

    font-size: 14px;
}

.historial-info {

}

.badge {

    white-space: nowrap;

    border-radius: 7px;

    font-size: 10px;

}

.badge.verde {

    background: #dcfce7;

    color: #166534;
}

.badge.rojo {

    background: #fee2e2;

    color: #991b1b;
}


/* FOOTER */

footer {

    text-align: center;

    color: var(--sub);

    font-size: 11px;

    padding: 20px;
}


/* RESPONSIVE */

@media(max-width:600px) {

    body {
        padding: 10px;
    }

    header h1 {
        font-size: 22px;
    }

    #cartel-estado h2 {
        font-size: 19px;
    }

    .botones {
        flex-direction: column;
    }

}

</style>

<div class="app">

<script>

/* =====================================================
   CONFIGURACIÓN SUPABASE
===================================================== */

const SUPABASE_URL =
    'https://adcbymcisaefkshctxzf.supabase.co';

const SUPABASE_KEY =
    'sb_publishable_LeJbAunpCFfHHUCEJXOO1w_QWKqQ5Lt';

const sb =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTOS
===================================================== */

const video =
    document.getElementById('video');

const canvas =
    document.getElementById('canvas');

const ctx =
    canvas.getContext(
        '2d',
        {
            willReadFrequently: true
        }
    );

const cartel =
    document.getElementById(
        'cartel-estado'
    );

const estadoConexion =
    document.getElementById(
        'estado-conexion'
    );

const selectorCamara =
    document.getElementById(
        'selector-camara'
    );

const nombreAlumno =
    document.getElementById(
        'nombre-alumno'
    );

const detalle =
    document.getElementById(
        'detalle'
    );

const listaHistorial =
    document.getElementById(
        'lista-historial'
    );


/* =====================================================
   CONFIGURACIÓN
===================================================== */

const CLAVE_CACHE =
    'polygym_cache_padron';

const INTERVALO_SINCRONIA_MS =
    60000;

const TIEMPO_ESPERA_MS =
    4000;


/* =====================================================
   VARIABLES
===================================================== */

let streamActual = null;

let ultimoEscaneo = 0;

let escaneando = false;

let historial = [];


/* =====================================================
   SEGURIDAD:
   ESCAPAR TEXTO HTML
===================================================== */

function escapeHTML(texto) {

    const div =
        document.createElement('div');

    div.textContent =
        texto ?? '';

    return div.innerHTML;
}


/* =====================================================
   CÁMARAS
===================================================== */

async function listarCamaras() {

    try {

        const dispositivos =
            await navigator
                .mediaDevices
                .enumerateDevices();

        const camaras =
            dispositivos.filter(
                d => d.kind === 'videoinput'
            );

        selectorCamara.innerHTML = '';

        camaras.forEach((camara, indice) => {

            const option =
                document.createElement('option');

            option.value =
                camara.deviceId;

            option.textContent =
                camara.label ||
                `Cámara ${indice + 1}`;

            selectorCamara.appendChild(
                option
            );

        });

    } catch (error) {

        console.error(
            'Error enumerando cámaras:',
            error
        );

    }
}


/* =====================================================
   INICIAR CÁMARA
===================================================== */

async function iniciarCamara(deviceId = null) {

    try {

        if (streamActual) {

            streamActual
                .getTracks()
                .forEach(track =>
                    track.stop()
                );
        }


        const constraints = {

            video: deviceId
                ? {
                    deviceId: {
                        exact: deviceId
                    }
                }
                : {
                    facingMode: {
                        ideal: 'environment'
                    }
                }

        };


        streamActual =
            await navigator
                .mediaDevices
                .getUserMedia(
                    constraints
                );


        video.srcObject =
            streamActual;


        await video.play();


        await listarCamaras();


        estadoConexion.textContent +=
            ' · 📷 Cámara lista';


    } catch (error) {

        console.error(error);

        estadoConexion.textContent =
            '❌ No se pudo acceder a la cámara.';

        mostrarEstado(
            'var(--rojo)',
            '❌ ERROR DE CÁMARA',
            error.message
        );

    }
}


/* =====================================================
   CAMBIAR CÁMARA
===================================================== */

function cambiarCamara(deviceId) {

    if (!deviceId) return;

    iniciarCamara(deviceId);

}


/* =====================================================
   DETENER CÁMARA
===================================================== */

function detenerCamara() {

    if (streamActual) {

        streamActual
            .getTracks()
            .forEach(track =>
                track.stop()
            );

        streamActual = null;

        video.srcObject = null;

    }

    mostrarEstado(
        '#64748b',
        '⛔ CÁMARA DETENIDA',
        'Presiona "Iniciar cámara" para continuar.'
    );
}


/* =====================================================
   CACHE LOCAL
===================================================== */

function guardarCache(padron) {

    localStorage.setItem(

        CLAVE_CACHE,

        JSON.stringify({

            actualizado:
                new Date().toISOString(),

            padron

        })

    );

}


function cargarCache() {

    try {

        const datos =
            JSON.parse(
                localStorage.getItem(
                    CLAVE_CACHE
                )
            );

        return datos || null;

    } catch {

        return null;

    }

}


/* =====================================================
   SINCRONIZAR PADRÓN
===================================================== */

async function sincronizarPadron() {

    try {

        const {
            data,
            error
        } =
            await sb.rpc(
                'obtener_padron_offline'
            );


        if (error) {

            throw error;

        }


        const padron = {};


        if (Array.isArray(data)) {

            data.forEach(fila => {

                if (!fila.boleta) return;

                padron[
                    String(fila.boleta)
                ] = {

                    nombre:
                        fila.nombre,

                    estado:
                        fila.estado,

                    horario:
                        fila.horario,

                    firma:
                        fila.firma

                };

            });

        }


        guardarCache(padron);


        const hora =
            new Date()
                .toLocaleTimeString(
                    'es-MX'
                );


        estadoConexion.textContent =
            `🟢 EN LÍNEA · Padrón actualizado ${hora}`;


    } catch (error) {

        console.warn(
            'Sin conexión:',
            error
        );


        const cache =
            cargarCache();


        if (cache) {

            const hora =
                new Date(
                    cache.actualizado
                )
                .toLocaleTimeString(
                    'es-MX'
                );


            estadoConexion.textContent =
                `🟠 SIN CONEXIÓN · Copia local de ${hora}`;

        } else {

            estadoConexion.textContent =
                '🔴 SIN CONEXIÓN · No existe copia local';

        }

    }


    setTimeout(
        sincronizarPadron,
        INTERVALO_SINCRONIA_MS
    );

}


/* =====================================================
   HORARIO
===================================================== */

function dentroDeHorario(horarioTexto) {

    if (!horarioTexto) {

        return true;

    }


    try {

        const partes =
            horarioTexto.split(' - ');


        if (partes.length !== 2) {

            return true;

        }


        const [hIni, mIni] =
            partes[0]
                .split(':')
                .map(Number);


        const [hFin, mFin] =
            partes[1]
                .slice(0, 5)
                .split(':')
                .map(Number);


        const ahora =
            new Date();


        const minutosAhora =
            ahora.getHours() * 60 +
            ahora.getMinutes();


        const minutosIni =
            hIni * 60 + mIni;


        const minutosFin =
            hFin * 60 + mFin;


        return (
            minutosAhora >= minutosIni &&
            minutosAhora <= minutosFin
        );


    } catch {

        return false;

    }

}


/* =====================================================
   VALIDACIÓN LOCAL
===================================================== */

function verificarConCopiaLocal(
    qrCompleto
) {

    const cache =
        cargarCache();


    if (
        !cache ||
        !cache.padron ||
        !qrCompleto.includes('|')
    ) {

        return null;

    }


    const partes =
        qrCompleto.split('|');


    if (partes.length !== 2) {

        return null;

    }


    const boleta =
        partes[0].trim();

    const firma =
        partes[1].trim();


    const registro =
        cache.padron[boleta];


    /*
       SI LA BOLETA NO EXISTE:
       DENEGAR
    */

    if (!registro) {

        return null;

    }


    /*
       SI LA FIRMA NO COINCIDE:
       DENEGAR
    */

    if (
        !registro.firma ||
        registro.firma !== firma
    ) {

        return null;

    }


    /*
       SOLO ACTIVO PUEDE CONTINUAR
    */

    const estado =
        String(
            registro.estado || ''
        )
        .trim()
        .toUpperCase();


    if (
        estado === 'ACTIVO' &&
        !dentroDeHorario(
            registro.horario
        )
    ) {

        return {

            nombre:
                registro.nombre,

            estado:
                'FUERA_DE_HORARIO'

        };

    }


    return {

        nombre:
            registro.nombre,

        estado:
            estado

    };

}


/* =====================================================
   MOSTRAR ESTADO
===================================================== */

function mostrarEstado(
    color,
    titulo,
    texto = ''
) {

    cartel.style.background =
        color;

    cartel.innerHTML = `

        <h2>
            ${titulo}
        </h2>

        <p>
            ${escapeHTML(texto)}
        </p>

    `;

}


/* =====================================================
   PROCESAR QR
===================================================== */

async function procesarQR(qrCompleto) {

qrCompleto = String(qrCompleto || '').trim();

console.log("QR DETECTADO:", qrCompleto);

// Si el QR está vacío
if (!qrCompleto) {
    mostrarEstado(
        'var(--rojo)',
        '❌ ACCESO DENEGADO',
        'El código QR está vacío.'
    );
    return;
}

let resultado = null;
let fuente = 'Supabase';


// ==========================================
// CONSULTAR SUPABASE
// ==========================================

try {

    console.log("Consultando Supabase...");

    const { data, error } = await sb.rpc(
        'verificar_acceso_seguro',
        {
            qr_completo: qrCompleto
        }
    );

    console.log("Respuesta Supabase:", data);
    console.log("Error Supabase:", error);

    if (error) {
        throw error;
    }

    if (data && data.length > 0) {
        resultado = data[0];
    } else {
        resultado = null;
    }


} catch (error) {

    console.error(
        "ERROR SUPABASE:",
        error
    );

    // Intentar copia local
    resultado =
        verificarConCopiaLocal(qrCompleto);

    fuente =
        'Copia local';


    /*
     * IMPORTANTE:
     *
     * Si tampoco existe en la copia local,
     * el acceso queda DENEGADO.
     */

}


// ==========================================
// QR NO REGISTRADO
// ==========================================

if (!resultado) {

    console.log(
        "QR NO REGISTRADO:",
        qrCompleto
    );

    mostrarEstado(
        'var(--rojo)',
        '❌ ACCESO DENEGADO',
        'QR no registrado en el sistema.'
    );

    agregarHistorial(
        'Desconocido',
        'QR no registrado',
        false
    );

    return;
}


// ==========================================
// OBTENER ESTADO
// ==========================================

const estado =
    String(resultado.estado || '')
    .trim()
    .toUpperCase();

const nombre =
    resultado.nombre ||
    'Alumno desconocido';


console.log(
    "ALUMNO:",
    nombre,
    "ESTADO:",
    estado
);


// ==========================================
// ÚNICA CONDICIÓN PARA ENTRAR
// ==========================================

if (estado === 'ACTIVO') {

    mostrarEstado(
        'var(--verde)',
        '✅ ACCESO PERMITIDO',
        `Alumno: ${nombre}`
    );

    cartel.innerHTML = `
        <h2>✅ ACCESO PERMITIDO</h2>

        <p>
            Alumno:
            <strong>
                ${escapeHTML(nombre)}
            </strong>
        </p>

        <div class="sufijo-offline">
            ${
                fuente === 'Supabase'
                ? '☁️ Verificado en línea'
                : '⚠️ Verificado con copia local'
            }
        </div>
    `;

    agregarHistorial(
        nombre,
        'Acceso permitido',
        true
    );

    return;
}


// ==========================================
// FUERA DE HORARIO
// ==========================================

if (estado === 'FUERA_DE_HORARIO') {

    mostrarEstado(
        'var(--naranja)',
        '⏰ ACCESO DENEGADO',
        `${nombre} · Fuera de horario`
    );

    agregarHistorial(
        nombre,
        'Fuera de horario',
        false
    );

    return;
}


// ==========================================
// ALERTA MÉDICA
// ==========================================

if (estado.includes('ALERTA')) {

    mostrarEstado(
        'var(--rojo)',
        '🚨 ACCESO DENEGADO',
        `${nombre} · Alerta médica`
    );

    agregarHistorial(
        nombre,
        'Alerta médica',
        false
    );

    return;
}


// ==========================================
// PENDIENTE
// ==========================================

if (estado === 'PENDIENTE') {

    mostrarEstado(
        'var(--naranja)',
        '⚠️ ACCESO DENEGADO',
        `${nombre} · Dictamen pendiente`
    );

    agregarHistorial(
        nombre,
        'Dictamen pendiente',
        false
    );

    return;
}


// ==========================================
// CUALQUIER OTRO ESTADO
// ==========================================

mostrarEstado(
    'var(--rojo)',
    '❌ ACCESO DENEGADO',
    `${nombre} · Estado no autorizado`
);

agregarHistorial(
    nombre,
    `Estado: ${estado}`,
    false
);
}



/* =====================================================
   HISTORIAL
===================================================== */

function agregarHistorial(
    nombre,
    motivo,
    permitido
) {

    historial.unshift({

        nombre,

        motivo,

        permitido,

        hora:
            new Date()
            .toLocaleTimeString(
                'es-MX'
            )

    });


    /*
       SOLO GUARDAMOS LOS ÚLTIMOS 10
    */

    historial =
        historial.slice(0, 10);


    renderHistorial();

}


function renderHistorial() {

    if (
        historial.length === 0
    ) {

        listaHistorial.innerHTML = `

            <p style="color:#718096;font-size:13px;">
                No hay accesos registrados
                en esta sesión.
            </p>

        `;

        return;

    }


    listaHistorial.innerHTML =
        historial.map(item => `

            <div class="
                historial-item
                ${item.permitido
                    ? 'permitido'
                    : 'denegado'}
            ">

                <div>

                    <div class="historial-nombre">
                        ${escapeHTML(
                            item.nombre
                        )}
                    </div>

                    <div class="historial-info">
                        ${escapeHTML(
                            item.motivo
                        )}
                        ·
                        ${escapeHTML(
                            item.hora
                        )}
                    </div>

                </div>

                <div class="
                    badge
                    ${item.permitido
                        ? 'verde'
                        : 'rojo'}
                ">

                    ${item.permitido
                        ? 'PERMITIDO'
                        : 'DENEGADO'}

                </div>

            </div>

        `).join('');

}


/* =====================================================
   BUCLE DEL ESCÁNER
===================================================== */

function bucleEscaneo() {

    if (
        video.readyState ===
        video.HAVE_ENOUGH_DATA
    ) {

        if (
            video.videoWidth > 0 &&
            video.videoHeight > 0
        ) {

            canvas.width =
                video.videoWidth;

            canvas.height =
                video.videoHeight;


            ctx.drawImage(
                video,
                0,
                0,
                canvas.width,
                canvas.height
            );


            const imageData =
                ctx.getImageData(
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


            const codigo =
                jsQR(
                    imageData.data,
                    imageData.width,
                    imageData.height,
                    {
                        inversionAttempts:
                            'attemptBoth'
                    }
                );


            /*
               EVITAR LEER EL MISMO QR
               REPETIDAMENTE
            */

            if (
                codigo &&
                codigo.data &&
                (
                    Date.now() -
                    ultimoEscaneo
                ) >
                TIEMPO_ESPERA_MS &&
                !escaneando
            ) {

                ultimoEscaneo =
                    Date.now();

                escaneando = true;


                mostrarEstado(
                    'var(--amarillo)',
                    '🔎 VALIDANDO QR...',
                    'Consultando registro de acceso'
                );


                procesarQR(
                    codigo.data.trim()
                )
                .finally(() => {

                    escaneando =
                        false;

                });

            }

        }

    }


    requestAnimationFrame(
        bucleEscaneo
    );

}


/* =====================================================
   ARRANQUE
===================================================== */

(async function() {

    try {

        await iniciarCamara();

        requestAnimationFrame(
            bucleEscaneo
        );

    } catch (error) {

        console.error(error);

    }


    /*
       SINCRONIZAR PADRÓN
    */

    sincronizarPadron();

})();

</script>
